name: verify

# Three jobs (Lean, the other checks, the paper), kept few so that the account's
# concurrent-job allowance stays free for other repositories.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean 4, checked by the kernel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check both certificates in the Lean kernel
        run: CHECKS="" bash scripts/run_all.sh

  checks:
    name: Python, Julia, C and C++ checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - run: SKIP_LEAN=1 bash scripts/run_all.sh

  paper:
    name: Build the paper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-publishers texlive-pictures cm-super lmodern zip unzip
      - run: bash scripts/build_paper.sh
